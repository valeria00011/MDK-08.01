<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        table {
            border-collapse: separate;
            width: 700px;
            height: 280px;
            margin-left: 10%; 
            text-align: left;
            box-shadow: 0 3px 10px;

        }
        thead {
            background-color:pink;
        }

        tbody {
            background-color: rgb(215, 241, 175)            
        }

        tfoot {
            background-color: rgb(182, 182, 247);

        }

        tfoot td:first-child {
            border-bottom-left-radius: 15px;
        }

         tfoot td:last-child {
            border-bottom-right-radius: 15px;
        }

        td:hover, th hover {
        background-color: rgb(141, 248, 150);
        cursor: pointer;

        }

         th hover {
        background-color: rgb(141, 248, 150);
        cursor: pointer;
         }

    </style>
</head>

                    <tr>

                    </tr>

                    <tr>

                    <tr>

                    <tr>

</body>
</html>
