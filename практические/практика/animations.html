<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
        }
        .element{
            background-color: rgb(206, 206, 206);
            width: 1000vh;
            height: 100vh;
            animation: fadeIn 5s 1;
            color: black;
        }
        
        
        @keyframes fadeIn{
            from{
                opacity: 0;
            }
            to{
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="element">123890-345832093849023482174</div>
</body>
</html>
