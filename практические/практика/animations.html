<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .element{
            background-color: black;
            width: 300px;
            height: 300px;
            color: aliceblue;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 20px;

        }
        .element:hover{
            background-color: rgb(100, 43, 200);
            transition: background-color 0.3s ease 0s;
            transform: scale(0.2 , 0.2);
        }
    </style>
</head>
<body>
    <div class="element">123</div>
</body>
</html>
