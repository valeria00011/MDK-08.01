<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        :root{
            --bg: #1a1a1a;
            --surface: #262626;
            --accent: #e63946;
            --text: #f1f1f1;
            --muted: #aaaaaa;
            --border-radius: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a{
            color: var(--text);
            text-decoration: none;
        }

        ul{
            list-style: none;
        }

        .header{
            background-color: var(--surface);
            padding: 16px 32px;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--accent);
            display: flex;
            flex-direction: row;
        }

        .nav {
            display: flex;
           gap: 24px 24px;
        }

        .logo{
            font-size: 22px;
            font-weight: bold;
        }

        .nav a:hover{
            color: rgb(255, 0, 0);
            cursor: pointer;
        }

        .sidebar{
            color: var(--surface);
            padding: 24px;
        }

        .sidebar h3{
            color: rgb(255, 0, 0);
            padding-bottom: 8px;
        }

        .layout{
            display: grid;
            grid-template-columns: 240px 1fr;
            flex: 1;
        }

        .main{
            padding: 32px;
        }

        .cards{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }

        .card{
            background-color: var(--surface);
            border-radius: var(--border-radius);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }


        .cover{
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 8px 8px 0 0;
            overflow: hidden;
        }
        .img{
            width: 100%;
            height: 100%;
        }

        .title{
            font-size: 16px;
        }

        .artist{
            color: var(--muted);
            font-size: 14px;
        }

        .genre{
            color: var(--accent);
            font-size: 14px;
            font-style: italic;
        }

        .price{
            font-size: 18px;
            font-weight: bold;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">Vinyl Store</div>

        <nav class="nav">
        <a href="#">Каталог</a>
        <a href="#">Новинки</a>
        <a href="#">Акции</a>
        <a href="#">Контакты</a>
    </nav>
    <div class="cart">Корзина(0)</div>
</header>
    <div class="content">
        <aside class="sidebar">
            <h3>Жанры</h3>
            <ul>
                <li><a href="#">Эмбиент</a></li>
                <li><a href="#">Индастриал</a></li>
                <li><a href="#">IDM</a></li>
                <li><a href="#">Электроника</a></li>
                <li><a href="#">Блюз</a></li>
                <li><a href="#">Экспериментальная</a></li>
                <li><a href="#">Классика</a></li>
                <li><a href="#">Джаз</a></li>
            </ul>
            <h3>Цена</h3>
                <p>от 500р до 5000р</p>
        </aside>
        <main class="main">
<h2>Каталог виниловых пластинок</h2>
<section class="cards"> 
    <article class="card">
        <div class="cover">
            <img src="7163338800.jpg" alt="The Fragile">
        </div>
        <h4 class="title">The Fragile</h4>
        <p class="artist">Nine Inch Nails</p>
        <p class="genre">Индастриал</p>
        <p class="price">9 500р</p>
        <button class="btn">Подробнее</button>
    </article>
</section>
        </main>
    </div>
</body>
</html>
